spring.application.name=ssafymng

# Active Profile (Default: dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Driver Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA Common Configuration
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# HTTP Response Gzip Compression (Network Payload 70~80% Reduction)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Static Resources Browser Cache (1 Year)
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Embedded Tomcat Optimization for Cloud VM
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# Spring AI / Google GenAI Configuration
# API key should be set via environment variable: export GEMINI_API_KEY=your_key or SPRING_AI_GOOGLE_GENAI_API_KEY=your_key
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Multipart Upload Limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File Upload Storage Directory
app.upload.dir=${APP_UPLOAD_DIR:./data/uploads}
