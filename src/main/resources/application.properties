spring.application.name=ssafymng

# Server Port
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ssafy_db?serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:quietjun}
spring.datasource.password=${DB_PASSWORD:dmstj@0205S}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Spring AI / Google GenAI Configuration
# API key should be set via environment variable: export GEMINI_API_KEY=your_key or SPRING_AI_GOOGLE_GENAI_API_KEY=your_key
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}
spring.ai.google.genai.chat.model=gemini-2.5-flash

# Multipart Upload Limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File Upload Storage Directory
app.upload.dir=./data/uploads
